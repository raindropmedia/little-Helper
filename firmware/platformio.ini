; M5Stack Dial v1.1 (StampS3 / ESP32-S3, 8 MB Flash, kein PSRAM)
[env:m5dial]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=2
board_build.embed_files = data/x509_crt_bundle.bin
lib_deps =
  m5stack/M5Dial@1.0.3
  m5stack/M5Unified@0.3.0
  m5stack/M5GFX@0.3.0
  bblanchon/ArduinoJson@7.4.3
